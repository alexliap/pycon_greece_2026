[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pycon_llm"]

[project]
name = "pycon-greece-2026"
version = "0.1.0"
description = "Interactive marimo slides for the PyCon Greece 2026 talk 'LLMs: from 0 to 0.1'"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "marimo>=0.23.16",
    "numpy>=2.5.1",
    "tiktoken>=0.13.0",
]
